[package]
name = "rb"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }

[dev-dependencies]
wiremock = "0.6"
